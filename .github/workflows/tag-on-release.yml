name: Tag on Release PR

on:
  pull_request:
    branches:
      - 'releases/**'
      - 'release/**'
  push:
    tags: 
      - "**"
    branches: 
      "**"

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get all commits in the PR
        id: get_commits
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMITS=$(gh pr view $PR_NUMBER --json commits --jq '.commits[].oid')
          echo "Commits in PR: $COMMITS"
          echo "::set-output name=commits::$COMMITS"

      - name: Check for tags on each commit
        id: check_tags
        run: |
          COMMITS=${{ steps.get_commits.outputs.commits }}
          for COMMIT in $COMMITS; do
            TAG=$(git tag --contains $COMMIT)
            if [ -z "$TAG" ]; then
              echo "No tag found for commit $COMMIT"
              exit 1
            else
              echo "Tag found for commit $COMMIT: $TAG"
            fi
          done
      